<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Ten Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Giao diện đặc biệt cho trang đăng nhập */
        .auth-page { 
            display: flex; 
            height: 100vh; 
            background: var(--bg-light); 
            border: 10px solid var(--border-dark); 
            box-sizing: border-box;
        }
        
        .form-side { 
            flex: 1; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: #C5E0B4;
        }
        
        .video-side { 
            flex: 1.2; 
            background: #fff; 
            border-left: 5px solid #000; 
            margin: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px;
            box-shadow: 5px 5px 0px #000;
            overflow: hidden;
        }

        .video-side img, .video-side iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pixel-input {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            background: #eee;
            margin-bottom: 15px;
            font-size: 20px;
            outline: none;
            box-shadow: inset -3px -3px 0px #bbb;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <!-- Bên trái: Form đăng nhập -->
        <div class="form-side">
            <!-- Logo shop -->
            <div class="logo-circle" style="width:150px; height:150px; margin-bottom: 20px;">
                <img src="logo.png" alt="Logo" style="width:80%; height:80%; object-fit:contain;">
            </div>

            <div class="btn-3d white" style="width:100%; margin-bottom:30px; font-size: 28px; cursor: default;">
                ĐĂNG NHẬP
            </div>

            <input type="text" id="l-phone" class="pixel-input" placeholder="Số điện thoại">
            <input type="password" id="l-pass" class="pixel-input" placeholder="Mật khẩu">
            
            <button onclick="login()" class="btn-3d" style="width: 100%; margin-top:10px; background: #70AD47;">
                VÀO CỬA HÀNG
            </button>

            <div style="margin-top: 20px;">
                <span>Chưa có tài khoản? </span>
                <a href="register.html" style="color: #385723; font-weight: bold;">Đăng Ký Ngay</a>
            </div>
            
            <a href="index.html" style="margin-top: 15px; color: #666; text-decoration: none;">← Quay lại trang chủ</a>
        </div>

        <!-- Bên phải: Video hoặc Ảnh nền quảng cáo -->
        <div class="video-side">
            <!-- Bạn có thể thay bằng thẻ <img> hoặc <iframe> youtube -->
            <div style="text-align: center; padding: 20px;">
                <p>Quảng cáo hoặc Video Shop</p>
                <small>(Thay bằng thẻ img hoặc iframe)</small>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const phone = document.getElementById('l-phone').value;
            const pass = document.getElementById('l-pass').value;

            if(!phone || !pass) {
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }

            // Lấy dữ liệu từ localStorage
            const storedData = localStorage.getItem(phone);
            
            if(storedData) {
                const userData = JSON.parse(storedData);
                if(userData.pass === pass) {
                    // Lưu trạng thái đã đăng nhập
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', userData.user);
                    
                    alert("Chào mừng " + userData.user + " quay trở lại!");
                    window.location.href = 'index.html';
                } else {
                    alert("Mật khẩu không chính xác!");
                }
            } else {
                alert("Số điện thoại này chưa được đăng ký!");
            }
        }
    </script>
</body>
</html>
